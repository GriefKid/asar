name: Test and package Windows

on:
  push:
    branches: [main, feat/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      - run: npm run build -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Asar-Windows-x64
          path: dist/Asar-Setup-*.exe
          if-no-files-found: error
