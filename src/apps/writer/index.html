<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نویسنده — اثر</title>
  <style>
    :root {
      --bg: #0f0f13; --bg2: #15151c; --bg3: #1c1c26; --bg4: #232330;
      --bd: rgba(255,255,255,.07); --bd2: rgba(255,255,255,.12);
      --t1: #f0f0f8; --t2: #a8a8c0; --t3: #5a5a78;
      --accent: #7B5EFF; --accent-lo: rgba(123,94,255,.12); --accent-mid: rgba(123,94,255,.3);
      --ok: #2FD6A8; --warn: #F5A623; --err: #FF5F7E;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      color: var(--t1);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      direction: rtl;
    }

    /* ── Titlebar ── */
    .titlebar {
      height: 36px; flex-shrink: 0;
      -webkit-app-region: drag;
      background: var(--bg2);
      border-bottom: 1px solid var(--bd);
      display: flex; align-items: center;
      padding: 0 12px;
    }
    .titlebar-title {
      font-size: 12px; color: var(--t3);
      font-family: 'Space Grotesk', sans-serif;
      flex: 1; text-align: center;
    }
    .titlebar-close {
      -webkit-app-region: no-drag;
      width: 24px; height: 24px; border-radius: 50%;
      background: rgba(255,95,126,.15); border: none;
      color: var(--err); font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .12s;
    }
    .titlebar-close:hover { background: var(--err); color: #fff; }

    .app-body {
      flex: 1; display: flex; overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg2);
      border-left: 1px solid var(--bd);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--bd);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 14px;
    }
    .new-doc-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 5px 10px; border-radius: 7px;
      background: var(--accent-lo); border: 1px solid var(--accent-mid);
      color: var(--accent); font-size: 12px; cursor: pointer;
      font-family: 'Space Grotesk', sans-serif; font-weight: 500;
      transition: all .13s;
    }
    .new-doc-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .doc-list { flex: 1; overflow-y: auto; padding: 8px; }
    .doc-list::-webkit-scrollbar { width: 3px; }
    .doc-list::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

    .doc-item {
      padding: 9px 11px; border-radius: 9px;
      cursor: pointer; transition: all .12s;
      border: 1px solid transparent;
      direction: rtl;
    }
    .doc-item:hover { background: var(--bg3); }
    .doc-item.active { background: var(--bg3); border-color: var(--bd2); }
    .doc-item-title { font-size: 12.5px; font-weight: 500; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .doc-item-meta { font-size: 10.5px; color: var(--t3); display: flex; gap: 6px; align-items: center; }
    .doc-type-badge {
      font-size: 9.5px; padding: 1px 5px; border-radius: 3px;
      font-family: 'Space Grotesk', sans-serif; font-weight: 500;
    }
    .badge-critique { background: rgba(245,166,35,.12); color: var(--warn); }
    .badge-story    { background: rgba(123,94,255,.12);  color: var(--accent); }
    .badge-note     { background: rgba(47,214,168,.12);  color: var(--ok); }

    .doc-item-del {
      float: left; padding: 2px 5px; border-radius: 4px; font-size: 10px;
      color: var(--t3); cursor: pointer; opacity: 0; transition: opacity .12s;
    }
    .doc-item:hover .doc-item-del { opacity: 1; }
    .doc-item-del:hover { background: rgba(255,95,126,.15); color: var(--err); }

    .doc-empty { padding: 24px 12px; text-align: center; color: var(--t3); font-size: 12px; line-height: 1.6; }

    /* ── Editor ── */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .editor-toolbar {
      padding: 10px 20px;
      border-bottom: 1px solid var(--bd);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .editor-title-inp {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--t1);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 18px;
      font-weight: 600;
      direction: rtl;
    }
    .editor-title-inp::placeholder { color: var(--t3); }

    .toolbar-sep { width: 1px; height: 18px; background: var(--bd); flex-shrink: 0; }

    .tb-btn {
      padding: 5px 9px; border-radius: 6px; cursor: pointer; font-size: 12px;
      color: var(--t2); border: 1px solid transparent; transition: all .12s;
      font-family: 'Space Grotesk', sans-serif; white-space: nowrap;
      background: none;
    }
    .tb-btn:hover { background: var(--bg3); color: var(--t1); border-color: var(--bd); }
    .tb-btn.on { background: var(--accent-lo); border-color: var(--accent-mid); color: var(--accent); }

    .doc-type-sel {
      background: var(--bg3); border: 1px solid var(--bd); color: var(--t2);
      padding: 5px 9px; border-radius: 6px; font-size: 12px; cursor: pointer;
      font-family: 'Vazirmatn', sans-serif; outline: none;
    }

    /* Link badge */
    .linked-badge {
      display: flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 6px;
      background: rgba(245,166,35,.1); border: 1px solid rgba(245,166,35,.25);
      color: var(--warn); font-size: 11px; cursor: pointer;
    }
    .linked-badge:hover { background: rgba(245,166,35,.2); }

    .editor-body { flex: 1; overflow-y: auto; padding: 24px 48px; }
    .editor-body::-webkit-scrollbar { width: 4px; }
    .editor-body::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 2px; }

    .editor-content {
      width: 100%; min-height: 100%;
      background: transparent; border: none; outline: none;
      color: var(--t1); font-family: 'Vazirmatn', sans-serif;
      font-size: 15px; line-height: 1.9;
      resize: none;
      direction: rtl; text-align: right;
    }
    .editor-content::placeholder { color: var(--t3); }

    .editor-footer {
      padding: 8px 20px;
      border-top: 1px solid var(--bd);
      display: flex; align-items: center; gap: 10px;
      font-size: 11px; color: var(--t3);
      flex-shrink: 0;
    }
    .save-status { margin-right: auto; }
    .save-btn {
      padding: 5px 14px; border-radius: 7px;
      background: var(--accent-lo); border: 1px solid var(--accent-mid);
      color: var(--accent); font-size: 12px; cursor: pointer;
      font-family: 'Space Grotesk', sans-serif; font-weight: 500;
      transition: all .13s;
    }
    .save-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── No document open ── */
    .no-doc {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      color: var(--t3);
    }
    .no-doc-icon { font-size: 42px; opacity: .4; }
    .no-doc-text { font-size: 13px; line-height: 1.6; text-align: center; }

    /* ── Link picker modal ── */
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
      z-index: 100; display: none; align-items: center; justify-content: center;
    }
    .modal-backdrop.show { display: flex; }
    .modal-box {
      background: var(--bg2); border: 1px solid var(--bd2);
      border-radius: 16px; padding: 24px; width: 420px; max-height: 70vh;
      display: flex; flex-direction: column; gap: 14px;
    }
    .modal-title { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 15px; }
    .modal-search {
      padding: 8px 12px; background: var(--bg3); border: 1px solid var(--bd);
      border-radius: 9px; color: var(--t1); font-family: 'Vazirmatn', sans-serif;
      font-size: 13px; outline: none; width: 100%; direction: rtl;
    }
    .modal-search:focus { border-color: var(--accent-mid); }
    .lib-pick-list { overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .lib-pick-list::-webkit-scrollbar { width: 3px; }
    .lib-pick-list::-webkit-scrollbar-thumb { background: var(--bg4); }
    .lib-pick-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 9px; cursor: pointer;
      transition: background .12s; direction: rtl;
    }
    .lib-pick-item:hover { background: var(--bg3); }
    .lib-pick-cover {
      width: 32px; height: 44px; border-radius: 4px; flex-shrink: 0;
      background: var(--bg4); display: flex; align-items: center; justify-content: center;
      font-size: 14px; overflow: hidden;
    }
    .lib-pick-cover img { width: 100%; height: 100%; object-fit: cover; }
    .lib-pick-info { flex: 1; min-width: 0; }
    .lib-pick-title { font-size: 13px; font-weight: 500; }
    .lib-pick-sub { font-size: 11px; color: var(--t3); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-btn {
      padding: 7px 16px; border-radius: 8px; cursor: pointer;
      font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 500;
      border: 1px solid var(--bd); color: var(--t2); transition: all .13s;
    }
    .modal-btn:hover { background: var(--bg3); color: var(--t1); }
    .modal-btn.primary { background: var(--accent-lo); border-color: var(--accent-mid); color: var(--accent); }
    .modal-btn.primary:hover { background: var(--accent); color: #fff; }
  </style>
<link rel="stylesheet" href="../../shared/appearance.css">
</head>
<body class="asar-media asar-writer">

<!-- Titlebar -->
<div class="titlebar">
  <button class="titlebar-close" onclick="window.api && window.api.quitApp ? window.close() : window.close()">×</button>
  <span class="titlebar-title">نویسنده — اثر</span>
</div>

<div class="app-body">

<!-- Sidebar: document list -->
<div class="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">نوشته‌ها</span>
    <div class="new-doc-btn" onclick="newDoc()">+ جدید</div>
  </div>
  <div class="doc-list" id="doc-list">
    <div class="doc-empty">هنوز هیچ نوشته‌ای نیست.<br>روی «جدید» کلیک کن.</div>
  </div>
</div>

<!-- Editor -->
<div class="editor-area" id="editor-area">
  <div class="no-doc" id="no-doc">
    <span class="asar-media-object asar-object-pen" aria-hidden="true"></span>
    <h1 class="asar-empty-title">نوشته‌ای انتخاب نشده</h1>
    <button type="button" class="asar-empty-action" onclick="newDoc()">نوشتهٔ جدید</button>
  </div>
  <div id="editor-wrapper" style="display:none;flex:1;flex-direction:column;overflow:hidden">
    <div class="editor-toolbar">
      <input class="editor-title-inp" id="doc-title" placeholder="عنوان سند..." onchange="markDirty()">
      <div class="toolbar-sep"></div>
      <select class="doc-type-sel" id="doc-type" onchange="onTypeChange()">
        <option value="note">📝 یادداشت</option>
        <option value="critique">🎯 نقد</option>
        <option value="story">✍️ داستان</option>
        <option value="essay">📄 مقاله</option>
      </select>
      <div id="link-badge-wrap"></div>
      <div class="toolbar-sep"></div>
      <button class="tb-btn" onclick="formatDoc('bold')"><b>B</b></button>
      <button class="tb-btn" onclick="formatDoc('italic')"><i>I</i></button>
      <button class="tb-btn" onclick="formatDoc('underline')"><u>U</u></button>
      <div class="toolbar-sep"></div>
      <button class="tb-btn" onclick="linkToLibrary()">🔗 لینک به اثر</button>
    </div>
    <div class="editor-body">
      <textarea class="editor-content" id="editor-content"
        placeholder="شروع کن به نوشتن..."
        oninput="markDirty(); updateWordCount()"></textarea>
    </div>
    <div class="editor-footer">
      <span id="word-count">۰ کلمه</span>
      <span class="save-status" id="save-status"></span>
      <button class="save-btn" onclick="saveCurrentDoc()">ذخیره</button>
    </div>
  </div>
</div>

</div><!-- end .app-body -->

<!-- Link picker modal -->
<div class="modal-backdrop" id="link-modal">
  <div class="modal-box">
    <div class="modal-title">نقد کدوم اثره؟</div>
    <input class="modal-search" id="link-search" placeholder="جستجو در کتابخانه..." oninput="filterLibPick()" autofocus>
    <div class="lib-pick-list" id="lib-pick-list"></div>
    <div class="modal-actions">
      <div class="modal-btn" onclick="closeLinkModal()">لغو</div>
    </div>
  </div>
</div>

<script>
const WRITER_KEY = 'asar-writer-docs';
const LIB_KEY    = 'asar-library';

let docs = [];
let currentDocId = null;
let isDirty = false;
let saveTimer = null;
let library = [];

function loadAll() {
  try { docs    = JSON.parse(localStorage.getItem(WRITER_KEY)) || []; } catch { docs = []; }
  try { library = JSON.parse(localStorage.getItem(LIB_KEY))    || []; } catch { library = []; }
}

function saveDocs() {
  localStorage.setItem(WRITER_KEY, JSON.stringify(docs));
  window.asarCollections?.refresh();
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function typeEmoji(t) {
  return t === 'book' ? '📚' : t === 'film' ? '🎬' : t === 'music' ? '🎵' : '📄';
}

function typeLabel(t) {
  return { note:'یادداشت', critique:'نقد', story:'داستان', essay:'مقاله' }[t] || t;
}

function typeBadgeClass(t) {
  return t === 'critique' ? 'badge-critique' : t === 'story' ? 'badge-story' : 'badge-note';
}

function renderDocList() {
  const el = document.getElementById('doc-list');
  if (!docs.length) {
    el.innerHTML = '<div class="doc-empty">هنوز هیچ نوشته‌ای نیست.<br>روی «جدید» کلیک کن.</div>';
    return;
  }
  el.innerHTML = docs.slice().reverse().map(doc => {
    const linked = doc.linkedItemId ? library.find(i => i.id === doc.linkedItemId) : null;
    return `<div class="doc-item ${doc.id === currentDocId ? 'active' : ''}" draggable="true"
      ondragstart="window.asarCollections?.startDrag(event,'item',${esc(JSON.stringify(doc.id))})" onclick="openDoc('${doc.id}')">
      <span class="doc-item-del" onclick="event.stopPropagation();deleteDoc('${doc.id}')">🗑</span>
      <div class="doc-item-title">${esc(doc.title || 'بدون عنوان')}</div>
      <div class="doc-item-meta">
        <span class="doc-type-badge ${typeBadgeClass(doc.type)}">${typeLabel(doc.type)}</span>
        ${linked ? `<span>📎 ${esc(linked.title)}</span>` : ''}
      </div>
    </div>`;
  }).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function newDoc() {
  saveCurrentDoc();
  const doc = {
    id: uid(),
    title: '',
    type: 'note',
    content: '',
    linkedItemId: null,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  docs.push(doc);
  saveDocs();
  openDoc(doc.id);
}

function openDoc(id) {
  saveCurrentDoc();
  currentDocId = id;
  const doc = docs.find(d => d.id === id);
  if (!doc) return;

  document.getElementById('no-doc').style.display = 'none';
  const wrap = document.getElementById('editor-wrapper');
  wrap.style.display = 'flex';

  document.getElementById('doc-title').value   = doc.title || '';
  document.getElementById('doc-type').value    = doc.type  || 'note';
  document.getElementById('editor-content').value = doc.content || '';

  updateLinkBadge(doc);
  updateWordCount();
  isDirty = false;
  document.getElementById('save-status').textContent = '';
  renderDocList();
  document.getElementById('editor-content').focus();
}

function updateLinkBadge(doc) {
  const wrap = document.getElementById('link-badge-wrap');
  if (doc && doc.linkedItemId) {
    const linked = library.find(i => i.id === doc.linkedItemId);
    if (linked) {
      wrap.innerHTML = `<div class="linked-badge" onclick="linkToLibrary()">📎 ${esc(linked.title)} <span style="font-size:9px;opacity:.6">×</span></div>`;
      return;
    }
  }
  wrap.innerHTML = '';
}

function onTypeChange() {
  markDirty();
  const doc = docs.find(d => d.id === currentDocId);
  if (!doc) return;
  const newType = document.getElementById('doc-type').value;
  doc.type = newType;
  if (newType === 'critique' && !doc.linkedItemId) {
    linkToLibrary();
  }
}

function markDirty() {
  isDirty = true;
  document.getElementById('save-status').textContent = 'تغییرات ذخیره نشده...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveCurrentDoc, 2000);
}

function saveCurrentDoc() {
  if (!currentDocId || !isDirty) return;
  const doc = docs.find(d => d.id === currentDocId);
  if (!doc) return;
  doc.title    = document.getElementById('doc-title').value.trim();
  doc.type     = document.getElementById('doc-type').value;
  doc.content  = document.getElementById('editor-content').value;
  doc.updatedAt = Date.now();
  saveDocs();
  isDirty = false;
  document.getElementById('save-status').textContent = 'ذخیره شد ✓';
  setTimeout(() => { if (!isDirty) document.getElementById('save-status').textContent = ''; }, 2000);
  renderDocList();
}

function deleteDoc(id) {
  docs = docs.filter(d => d.id !== id);
  saveDocs();
  if (currentDocId === id) {
    currentDocId = null;
    isDirty = false;
    document.getElementById('editor-wrapper').style.display = 'none';
    document.getElementById('no-doc').style.display = '';
  }
  renderDocList();
}

function updateWordCount() {
  const text = document.getElementById('editor-content').value;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('word-count').textContent = toFarsiNum(words) + ' کلمه';
}

function toFarsiNum(n) {
  return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

function formatDoc(cmd) {
  // Simple: wrap selection with markers in textarea
  const ta = document.getElementById('editor-content');
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (s === e) return;
  const sel = ta.value.slice(s, e);
  const markers = { bold: '**', italic: '_', underline: '__' };
  const m = markers[cmd] || '';
  const newVal = ta.value.slice(0, s) + m + sel + m + ta.value.slice(e);
  ta.value = newVal;
  ta.selectionStart = s;
  ta.selectionEnd   = e + m.length * 2;
  markDirty();
}

// ── Link to library ───────────────────────────────────────────────────────
let libPickCallback = null;

function linkToLibrary() {
  loadAll();
  renderLibPick('');
  document.getElementById('link-modal').classList.add('show');
  document.getElementById('link-search').value = '';
  document.getElementById('link-search').focus();
}

function closeLinkModal() {
  document.getElementById('link-modal').classList.remove('show');
}

function filterLibPick() {
  renderLibPick(document.getElementById('link-search').value);
}

function renderLibPick(q) {
  const list = document.getElementById('lib-pick-list');
  const items = library.filter(i =>
    !q || i.title.toLowerCase().includes(q.toLowerCase()) || (i.creator||'').toLowerCase().includes(q.toLowerCase())
  );
  if (!items.length) {
    list.innerHTML = '<div style="padding:16px;text-align:center;color:var(--t3);font-size:12px">چیزی پیدا نشد</div>';
    return;
  }
  list.innerHTML = items.map(item => `
    <div class="lib-pick-item" onclick="pickLibItem('${item.id}')">
      <div class="lib-pick-cover">
        ${item.cover ? `<img src="${esc(item.cover)}" onerror="this.parentElement.textContent='${typeEmoji(item.type)}'">` : typeEmoji(item.type)}
      </div>
      <div class="lib-pick-info">
        <div class="lib-pick-title">${esc(item.title)}</div>
        <div class="lib-pick-sub">${esc(item.creator||'')} ${item.year?'· '+esc(item.year):''}</div>
      </div>
    </div>`).join('');
}

function pickLibItem(itemId) {
  const doc = docs.find(d => d.id === currentDocId);
  if (!doc) { closeLinkModal(); return; }
  doc.linkedItemId = itemId;
  saveDocs();
  updateLinkBadge(doc);
  closeLinkModal();
  renderDocList();
}

// ── Init ──────────────────────────────────────────────────────────────────
loadAll();
renderDocList();

function handleWriterRequest() {
try {
  const openWith = JSON.parse(localStorage.getItem('writer-open-with') || 'null');
  if (openWith?.action === 'new-doc') {
    localStorage.removeItem('writer-open-with');
    newDoc();
  } else if (openWith?.action === 'open-doc') {
    localStorage.removeItem('writer-open-with');
    openDoc(openWith.id);
  } else if (openWith?.action === 'new-critique') {
    localStorage.removeItem('writer-open-with');
    // Check if a critique for this book already exists
    const existing = docs.find(d => d.type === 'critique' && d.linkedItemId === openWith.linkId);
    if (existing) {
      openDoc(existing.id);
    } else {
      // Create new critique pre-linked to this book
      const libItem = library.find(i => i.id === openWith.linkId || i.title === openWith.linkTitle);
      const doc = {
        id: uid(),
        title: `نقد: ${openWith.linkTitle}`,
        type: 'critique',
        content: '',
        linkedItemId: libItem?.id || openWith.linkId,
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
      docs.push(doc);
      saveDocs();
      openDoc(doc.id);
      renderDocList();
    }
  }
} catch {}
}
handleWriterRequest();
window.addEventListener('storage', event => { if (event.key === 'writer-open-with' && event.newValue) handleWriterRequest(); });
window.asarCollectionSource = {
  items: () => docs,
  open: id => openDoc(id)
};

</script>
