<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0E0E24"/>
      <stop offset="100%" style="stop-color:#04040C"/>
    </linearGradient>
    <linearGradient id="grd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9B7FFF"/>
      <stop offset="50%" style="stop-color:#7B5EFF"/>
      <stop offset="100%" style="stop-color:#5B3FDF"/>
    </linearGradient>
    <linearGradient id="grd2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C4B0FF"/>
      <stop offset="100%" style="stop-color:#7B5EFF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <radialGradient id="glow-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7B5EFF;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#7B5EFF;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Soft glow behind icon -->
  <circle cx="256" cy="230" r="180" fill="url(#glow-bg)"/>

  <!-- Film strip left -->
  <rect x="58" y="148" width="88" height="124" rx="10" fill="none" stroke="url(#grd)" stroke-width="2.5" opacity="0.5"/>
  <rect x="64" y="156" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>
  <rect x="64" y="174" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>
  <rect x="64" y="192" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>
  <rect x="64" y="210" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>
  <rect x="64" y="228" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>
  <rect x="64" y="246" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>
  <rect x="122" y="156" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>
  <rect x="122" y="174" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>
  <rect x="122" y="192" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>
  <rect x="122" y="210" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>
  <rect x="122" y="228" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>
  <rect x="122" y="246" width="18" height="12" rx="3" fill="url(#grd)" opacity="0.4"/>

  <!-- Music note right -->
  <g opacity="0.5" transform="translate(354, 148)">
    <circle cx="20" cy="96" r="16" fill="none" stroke="url(#grd)" stroke-width="2.5"/>
    <line x1="36" y1="96" x2="36" y2="30" stroke="url(#grd)" stroke-width="2.5"/>
    <line x1="36" y1="30" x2="82" y2="20" stroke="url(#grd)" stroke-width="2.5"/>
    <circle cx="66" cy="86" r="16" fill="none" stroke="url(#grd)" stroke-width="2.5"/>
    <line x1="82" y1="86" x2="82" y2="20" stroke="url(#grd)" stroke-width="2.5"/>
  </g>

  <!-- Book open (subtle, behind main) -->
  <g opacity="0.25">
    <path d="M165 320 Q256 300 347 320 L347 420 Q256 400 165 420 Z" fill="url(#grd)"/>
    <line x1="256" y1="300" x2="256" y2="420" stroke="#7B5EFF" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Main center mark — stylized "اثر" symbol -->
  <!-- Outer ring -->
  <circle cx="256" cy="224" r="96" fill="none" stroke="url(#grd)" stroke-width="2" opacity="0.3"/>

  <!-- Inner filled circle -->
  <circle cx="256" cy="224" r="80" fill="url(#grd)" filter="url(#glow)" opacity="0.95"/>

  <!-- Star/asterisk inside -->
  <g transform="translate(256,224)" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.9">
    <line x1="0" y1="-44" x2="0" y2="44"/>
    <line x1="-44" y1="0" x2="44" y2="0"/>
    <line x1="-31" y1="-31" x2="31" y2="31"/>
    <line x1="31" y1="-31" x2="-31" y2="31"/>
  </g>
  <!-- Center dot -->
  <circle cx="256" cy="224" r="10" fill="white" opacity="0.95"/>

  <!-- Dots around circle -->
  <circle cx="256" cy="136" r="4" fill="white" opacity="0.4"/>
  <circle cx="332" cy="162" r="3" fill="white" opacity="0.3"/>
  <circle cx="348" cy="236" r="4" fill="white" opacity="0.4"/>
  <circle cx="332" cy="310" r="3" fill="white" opacity="0.3"/>
  <circle cx="256" cy="334" r="4" fill="white" opacity="0.4"/>
  <circle cx="180" cy="310" r="3" fill="white" opacity="0.3"/>
  <circle cx="162" cy="236" r="4" fill="white" opacity="0.4"/>
  <circle cx="180" cy="162" r="3" fill="white" opacity="0.3"/>

  <!-- App name -->
  <text x="256" y="400" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="72" font-weight="700" fill="url(#grd2)" letter-spacing="-2">اثر</text>

  <!-- Tagline -->
  <text x="256" y="440" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400" fill="#6060AA" letter-spacing="1">تجربه‌های فرهنگی</text>
</svg>
